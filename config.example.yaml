# TudoMesh configuration - example
# Copy to config.yaml in your data directory.

mqtt:
  broker: mqtt://localhost:1883   # the broker your robots publish to

# Each vacuum only needs its Valetudo URL. Its id (Valetudo systemId), MQTT
# topics and map API are read from the robot at startup and remembered in
# .vacuums.json for robots that are offline later.
vacuums:
  - url: http://vacuum1.local
    color: "#43b0f1"            # optional; used by the composite views
  - url: http://vacuum2.local
    color: "#057dcd"
  - url: http://192.168.1.102   # IPs work too

# Everything below is optional.

# mqtt:
#   clientId: tudomesh              # default: tudomesh-<hostname>
#   username: mqtt_user
#   password: mqtt_password

# reference: FrugalLameLion   # vacuum id used as the world origin;
#                             # default: the robot with the largest map

# gridSpacing: 1000           # grid line spacing in map units

# Per-vacuum overrides (rarely needed):
#   id: name        # instead of the Valetudo systemId
#   topic: ...      # instead of <topicPrefix>/<identifier>/MapData/map-data
#   rotation: 180   # only if `tudomesh --calibrate` reports "grid-ambiguous";
#                   # alignment then searches within ±20° of this angle
#   translation: {x: 50, y: -100}   # extra offset in map pixels after alignment
